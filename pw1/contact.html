<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Контакти та Підписка</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Зв'язок та Підписка 📩</h1>
        <p>Маєш артефакт із Зони або знаєш, де у Львові найдешевша кава? Пиши сюди!</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Головна</a></li>
            <li><a href="malka-tokmachka.html">Мала Токмачка</a></li>
            <li><a href="lviv.html">Львів</a></li>
            <li><a href="chornobyl.html">Чорнобиль</a></li>

            <li><a href="contact.html">Контакти та Підписка</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Форма зворотного зв'язку</h2>
            <form action="#" method="post">
                <label for="name">Ваше ім'я:</label>
                <input type="text" id="name" name="name" placeholder="Скіф чи Мечений" required>

                <label for="email">Електронна пошта:</label>
                <input type="email" id="email" name="email" placeholder="stalker@zone.ua" required>

                <label for="subject">Тема повідомлення:</label>
                <input type="text" id="subject" name="subject" placeholder="Питання / Мем">

                <label for="message">Повідомлення:</label>
                <textarea id="message" name="message" rows="5" placeholder="Напишіть щось потужне..."></textarea>

                <button type="submit">Надіслати</button>
            </form>
        </section>

        <section>
            <h2>Підпишіться на розсилку оновлень</h2>
            <form action="#" method="post">
                <label for="sub-email">Ваш Email для розсилки:</label>
                <input type="email" id="sub-email" name="sub-email" placeholder="enter@email.com" required>

                <label>
                    <input type="checkbox" name="agree" required> Згоден отримувати сповіщення про нові пригоди
                </label>
                <br><br>

                <button type="submit">Підписатися</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Global Adventures Blog.</p>
    </footer>

</body>
</html>
